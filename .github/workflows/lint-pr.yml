name: Lint PR

# pull_request_target runs with the main-branch workflow, so it works for
# fork PRs without exposing secrets to untrusted code.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited      # Re-run when the PR title changes
      - synchronize # Re-run when commits are pushed (required for required checks)

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Standard conventional commit types.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Subjects must start with a lowercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}" must start
            with a lowercase letter. Please rewrite it to match the Conventional
            Commits spec (https://www.conventionalcommits.org/).
          # The branch ruleset enforces squash-only merges, so the PR title is
          # always used as the commit message on main — regardless of how many
          # commits the PR contains. Validating the title here is sufficient to
          # guarantee every commit on main is a valid conventional commit.
