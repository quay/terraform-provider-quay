name: Continuous Delivery

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    # Only run if CI actually passed (not failed or cancelled)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Checkout Code
        if: &release-created ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout the exact commit that the release tag points to
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Go
        if: *release-created
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'

      - name: Import GPG key
        if: *release-created
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        if: *release-created
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag_name }}

      - name: Attest build provenance
        if: *release-created
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ./dist/terraform-provider-quay_${{ steps.release.outputs.version }}_SHA256SUMS
